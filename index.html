<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentanomia-25 Typology</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="p-2 sm:p-4 max-w-xl mx-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const layers = [
      { code: 'L1', name: '身体・本能', bg: 'bg-red-100', text: 'text-red-900', border: 'border-red-300', activeBorder: 'ring-4 ring-red-500' },
      { code: 'L2', name: '感情・対人', bg: 'bg-blue-100', text: 'text-blue-900', border: 'border-blue-300', activeBorder: 'ring-4 ring-blue-500' },
      { code: 'L3', name: '役割・集団', bg: 'bg-green-100', text: 'text-green-900', border: 'border-green-300', activeBorder: 'ring-4 ring-green-500' },
      { code: 'L4', name: '認知・システム', bg: 'bg-yellow-100', text: 'text-yellow-900', border: 'border-yellow-300', activeBorder: 'ring-4 ring-amber-500' },
      { code: 'L5', name: '超越・全体最適', bg: 'bg-purple-100', text: 'text-purple-900', border: 'border-purple-300', activeBorder: 'ring-4 ring-purple-500' }
    ];

    const directions = [
      { code: 'D1', name: '意志・牽引' },
      { code: 'D2', name: '観察・防衛' },
      { code: 'D3', name: '実行・調達' },
      { code: 'D4', name: '調和・維持' },
      { code: 'D5', name: '拡張・変化' }
    ];

    const matrixData = [
      // L1
      { id: 'L1D1', lIndex: 0, dIndex: 0, name: '身体的野生の覇者', desc: '圧倒的な体力や本能的直感で場を支配し、最前線で突破口を開くエネルギーの体現者。' },
      { id: 'L1D2', lIndex: 0, dIndex: 1, name: '本能的リスク検知者', desc: '危険や違和感を感覚的に素早く察知し、未然に危機を回避・防衛する鋭い直感力を持つ。' },
      { id: 'L1D3', lIndex: 0, dIndex: 2, name: '身体求道者・職人', desc: '自らの身体機能や技術を極限まで磨き上げ、実体ある成果や作品を確実に生み出す。' },
      { id: 'L1D4', lIndex: 0, dIndex: 3, name: '生理的快適保護者', desc: '居住環境や生活習慣の安定を第一に考え、身近な人々の身体的・生理的な安心を守る。' },
      { id: 'L1D5', lIndex: 0, dIndex: 4, name: '感覚的冒険家', desc: '新たな身体体験や未知の環境へ飛び込み、五感をフルに活用して新しい風を吹き込む。' },
      // L2
      { id: 'L2D1', lIndex: 1, dIndex: 0, name: '情熱的支配者', desc: '強い感情とカリスマ性で人々の心を動かし、情熱的なモチベーションで集団を引っ張る。' },
      { id: 'L2D2', lIndex: 1, dIndex: 1, name: '対人警戒の洞察者', desc: '相手の感情の裏にある真意や人間関係の摩擦を見抜き、不必要な対人トラブルを防ぐ。' },
      { id: 'L2D3', lIndex: 1, dIndex: 2, name: '献身的サポーター', desc: '他者の感情やニーズに寄り添い、実質的な対人支援や心配りで関係性を支える。' },
      { id: 'L2D4', lIndex: 1, dIndex: 3, name: '感情的共振者', desc: '場やチームの空気感を読み取り、調和を生み出すことで関係性の安定と一体感を維持する。' },
      { id: 'L2D5', lIndex: 1, dIndex: 4, name: '関係性の変革者', desc: '固定化した対人関係や冷え切った雰囲気に揺さぶりをかけ、感情的なブレイクスルーを起こす。' },
      // L3
      { id: 'L3D1', lIndex: 2, dIndex: 0, name: '集団の旗振り役', desc: 'チームの目指すべきビジョンを掲げ、役割分担を明確にして集団の目標達成を推進する。' },
      { id: 'L3D2', lIndex: 2, dIndex: 1, name: '集団の安全弁', desc: '組織のコンプライアンスやリスクを厳しく見守り、集団が崩壊しないようブレーキをかける。' },
      { id: 'L3D3', lIndex: 2, dIndex: 2, name: '集団の大黒柱', desc: '現場の実務を取り仕切り、着実なリソース管理とタスク遂行で組織の土台を強固にする。' },
      { id: 'L3D4', lIndex: 2, dIndex: 3, name: '集団のクッション', desc: 'メンバー間の衝突を和らげ、潤滑油として機能することで組織全体の和を保つ。' },
      { id: 'L3D5', lIndex: 2, dIndex: 4, name: '集団のスカウト', desc: '外部から新しい人材や機会を引き入れ、組織に多様性と新しい風を取り込む。' },
      // L4
      { id: 'L4D1', lIndex: 3, dIndex: 0, name: 'システムの推進者', desc: '論理的思考と戦略で新規プロジェクトや業務システムを設計し、強力に推し進める。' },
      { id: 'L4D2', lIndex: 3, dIndex: 1, name: 'システムの管理者', desc: 'データの整合性や運用のエラーを厳密にモニタリングし、システムの健全性を保つ。' },
      { id: 'L4D3', lIndex: 3, dIndex: 2, name: 'システムの運用者', desc: '複雑なフレームワークやツールを実務に落とし込み、効率的なオペレーションを実現する。' },
      { id: 'L4D4', lIndex: 3, dIndex: 3, name: 'システムの調整者', desc: '既存システム同士の相律や不整合を調整し、全体が滑らかに連動するようチューニングする。' },
      { id: 'L4D5', lIndex: 3, dIndex: 4, name: 'システムの再定義者', desc: '既存のルールや仕組みの限界を見抜き、新世代のフレームワークへとアップデートする。' },
      // L5
      { id: 'L5D1', lIndex: 4, dIndex: 0, name: 'グランドデザイナー', desc: '長期的かつ壮大な世界的ビジョンを描き、社会全体を導く新たな概念を生み出す。' },
      { id: 'L5D2', lIndex: 4, dIndex: 1, name: '時代を見守る老賢者', desc: '歴史の俯瞰的視点から本質的なリスクを見抜き、大局的な判断とアドバイスを与える。' },
      { id: 'L5D3', lIndex: 4, dIndex: 2, name: '構造構築者', desc: '単なる理想論に終わらせず、自律駆動するプラットフォームやエコシステムを現実空間に定着させる。' },
      { id: 'L5D4', lIndex: 4, dIndex: 3, name: '存在の統合者', desc: '対立する多様な価値観や思想を高い次元で統合し、全体に平和と安寧をもたらす。' },
      { id: 'L5D5', lIndex: 4, dIndex: 4, name: '次元超越者', desc: '既存のパラダイムを完全に超越し、人類の思考や価値観のフロンティアを切り開く。' }
    ];

    function App() {
      const [selected, setSelected] = useState(matrixData[22]); // デフォルト：構造構築者(L5D3)

      const layerInfo = layers[selected.lIndex];
      const dirInfo = directions[selected.dIndex];

      return (
        <div class="flex flex-col items-center">
          {/* ヘッダーエリア */}
          <div class="w-full flex flex-row items-start justify-between gap-3 mb-4">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-gray-900">ペンタノミア</h1>
              <p class="text-xs text-gray-400 font-light">
                Pentanomia-25 <span class="text-gray-300">Typology</span>
              </p>
            </div>
            <div class="text-xs text-gray-600 leading-relaxed max-w-[55%] text-right">
              この理論は、身体、感情、役割、認知、超越の5つの層を、相性の良い5つの方向性で分析し、人間の特性を体系化するものです。
            </div>
          </div>

          {/* マトリクス本体テーブル */}
          <div class="w-full overflow-x-auto mb-4">
            <table class="w-full text-center border-collapse text-xs">
              <thead>
                <tr>
                  <th class="p-1 w-1/6 font-semibold text-gray-500"></th>
                  {directions.map((d) => (
                    <th key={d.code} class="p-1 w-1/6 leading-tight font-medium text-gray-700">
                      <div class="font-bold text-[10px] text-gray-400">{d.code}</div>
                      <div>{d.name.split('・')[0]}・</div>
                      <div>{d.name.split('・')[1]}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {layers.map((layer, lIdx) => (
                  <tr key={layer.code}>
                    {/* 縦軸ラベル（枠線なし） */}
                    <td class="p-1 font-medium text-gray-700 leading-tight">
                      <div class="font-bold text-[10px] text-gray-400">{layer.code}</div>
                      <div>{layer.name.split('・')[0]}・</div>
                      <div>{layer.name.split('・')[1]}</div>
                    </td>
                    {/* セル */}
                    {directions.map((dir, dIdx) => {
                      const item = matrixData.find(m => m.lIndex === lIdx && m.dIndex === dIdx);
                      const isSelected = selected.id === item.id;

                      return (
                        <td key={item.id} class="p-0.5">
                          <button
                            onClick={() => setSelected(item)}
                            class={`w-full h-16 sm:h-20 p-1 rounded border flex flex-col justify-center items-center text-center transition-all ${layer.bg} ${layer.text} ${layer.border} ${isSelected ? `${layer.activeBorder} font-bold scale-105 z-10 shadow-md` : 'hover:opacity-80'}`}
                          >
                            <span class="text-[9px] opacity-60 mb-0.5">{item.id}</span>
                            <span class="text-[11px] sm:text-xs leading-tight font-medium">
                              {item.name}
                            </span>
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 詳細カード */}
          <div class={`w-full p-4 rounded-xl border ${layerInfo.bg} ${layerInfo.border} shadow-sm transition-all`}>
            <div class="text-xs font-semibold text-gray-500 mb-1">
              {selected.id} (第{selected.lIndex + 1}層: {layerInfo.name} × {dirInfo.name})
            </div>
            <h2 class={`text-lg font-bold mb-2 ${layerInfo.text}`}>
              {selected.name}
            </h2>
            <p class="text-xs sm:text-sm text-gray-700 leading-relaxed">
              {selected.desc}
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
